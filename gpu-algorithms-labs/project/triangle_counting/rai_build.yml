rai:
  version: 0.2
  image: raiproject/pumps2018:triangle-counting-amd64-cuda100
resources:
  cpu:
    architecture: amd64
  gpu:
    count: 1
  limits:
    network: true
commands:
  build:
    - cp -r /src . # ensure source code is in upload folder
    - /opt/cmake/bin/cmake /src -DCMAKE_PREFIX_PATH=${PANGOLIN_INSTALL_DIR} -DGRAPH_PREFIX_PATH=\"/graphs\"
    - make
    - ./tc -c LINEAR
    - nvprof -o timeline.nvprof ./tc -c LINEAR
    #- nvprof --kernels "kernel_tc" --analysis-metrics -o kernel_tc.analysis.nvprof ./tc -c LINEAR
    #- nvprof --kernels "child_tc" --analysis-metrics -o child_kernel.analysis.nvprof ./tc -c LINEAR
    # - ./tc -a

