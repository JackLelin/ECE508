rai:
  version: 0.2
  image: raiproject/pumps2018:triangle-counting-amd64-cuda100
resources:
  cpu:
    architecture: amd64
  gpu:
    count: 1
  limits:
    network: true
commands:
  build:
    - cp -r /src . # ensure source code is in upload folder
    - /opt/cmake/bin/cmake /src -DCMAKE_PREFIX_PATH=${PANGOLIN_INSTALL_DIR} -DGRAPH_PREFIX_PATH=\"/graphs\"
    - make
    - nvprof ./tc -c LINEAR
    - nvprof -o timeline.nvprof ./tc -c LINEAR
    - nvprof --kernels "linear_search" --analysis-metrics -o linear_search.analysis.nvprof ./tc -c LINEAR
    #- ./tc -a
    #- nvprof -o timeline.nvprof ./tc -a
    #- nvprof --kernels "binary_search" --analysis-metrics -o binary_search.analysis.nvprof ./tc -a
